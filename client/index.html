<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AoT 3D Multiplayer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: sans-serif; }
        canvas { display: block; }
        
        /* In-Game UI */
        #ui { position: absolute; top: 10px; left: 10px; color: white; text-shadow: 1px 1px 2px black; display: none; z-index: 10;}
        #titanUI { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: yellow; font-size: 24px; text-shadow: 2px 2px 4px black; display: none; z-index: 10;}
        
        /* Menus */
        .menu-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 100; }
        .menu-box { background: #222; padding: 40px; border-radius: 10px; text-align: center; width: 300px; }
        button { background: #8B0000; color: white; border: none; padding: 15px 30px; font-size: 18px; cursor: pointer; margin: 10px; border-radius: 5px; width: 100%; font-weight: bold;}
        button:hover { background: #ff0000; }
        
        .setting-row { margin: 15px 0; text-align: left; }
        .setting-row label { display: block; margin-bottom: 5px; }
        .setting-row input[type="range"] { width: 100%; }
    </style>
</head>
<body>
    <!-- In-Game UI -->
    <div id="ui">Scouts Online: <span id="playerCount">1</span></div>
    <div id="odmUI" style="position: absolute; bottom: 20px; right: 20px; color: white; text-align: right; font-family: monospace; font-size: 18px; text-shadow: 2px 2px 4px black; display: none; z-index: 10;">
        <div>GAS: <span id="gasVal" style="color: #00ff00;">100%</span></div>
        <div>BLADES: <span id="bladeCount">3</span> (<span id="bladeDurability">100%</span>)</div>
        <div style="font-size: 12px; color: #aaa;">(Stand on the Giant Wall to Refill)</div>
    </div>
    <div id="titanUI">Active Titan: <span id="activeTitanName">None</span></div>

    <!-- Add this inside the Settings Menu, right below Look Sensitivity -->
    <div class="setting-row">
      <label>Enable Mobile Controls</label>
      <input type="checkbox" id="mobileToggle">
  </div>

  <!-- Add this right above <script type="module" src="/src/main.js"></script> -->
  <div id="mobileUI" style="display: none; position: absolute; bottom: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5;">
      <!-- Left Joystick (Movement) -->
      <div id="joyLeft" style="position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; background: rgba(255,255,255,0.2); border-radius: 50%; pointer-events: auto;">
          <div id="stickLeft" style="position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255,255,255,0.5); border-radius: 50%;"></div>
      </div>
      
      <!-- Right Joystick (Camera) -->
      <div id="joyRight" style="position: absolute; bottom: 40px; right: 40px; width: 120px; height: 120px; background: rgba(255,255,255,0.2); border-radius: 50%; pointer-events: auto;">
          <div id="stickRight" style="position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255,255,255,0.5); border-radius: 50%;"></div>
      </div>

      <!-- Action Buttons -->
      <div style="position: absolute; bottom: 180px; right: 40px; pointer-events: auto; display: flex; flex-direction: column; gap: 10px;">
          <button id="btnJump" style="padding: 15px; border-radius: 50%; width: 60px; height: 60px;">JMP</button>
          <button id="btnGrapple" style="padding: 15px; border-radius: 50%; width: 60px; height: 60px;">GRP</button>
          <button id="btnShift" style="padding: 15px; border-radius: 50%; width: 60px; height: 60px; background: #ffaa00;">SHF</button>
      </div>
  </div>

    <!-- Main Menu -->
    <div id="mainMenu" class="menu-overlay">
        <div class="menu-box">
            <h1>ATTACK ON TITAN</h1>
            <button id="playBtn">Play (Join Lobby)</button>
            <button id="settingsBtn">Settings</button>
        </div>
    </div>

    <!-- Settings Menu -->
    <div id="settingsMenu" class="menu-overlay" style="display: none;">
        <div class="menu-box" style="width: 400px;">
            <h2>Settings</h2>
            <div class="setting-row">
                <label>Render Distance: <span id="renderVal">1000</span></label>
                <input type="range" id="renderDist" min="100" max="2000" value="1000">
            </div>
            <div class="setting-row">
                <label>Look Sensitivity: <span id="sensVal">1.0</span></label>
                <input type="range" id="sensitivity" min="0.1" max="3.0" step="0.1" value="1.0">
            </div>
            <p style="font-size: 12px; color: #aaa;">(Keybinds & Mobile Controls coming in Chunk 5!)</p>
            <button id="closeSettingsBtn">Back</button>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
