<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJK: Culling Games Arena</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');
        body { margin: 0; overflow: hidden; background-color: #111; font-family: 'Bebas Neue', sans-serif; color: white; user-select: none; }
        canvas { display: block; }
        
        /* Character Select Screen */
        #charSelect { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        h1 { font-size: 60px; color: #ff0000; text-shadow: 2px 2px 0 #fff; margin-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; max-width: 900px; max-height: 60vh; overflow-y: auto; padding: 20px; }
        .char-btn { background: #222; border: 2px solid #555; color: white; padding: 15px; font-size: 20px; cursor: pointer; font-family: 'Bebas Neue'; transition: 0.2s; }
        .char-btn:hover { background: #ff0000; border-color: #fff; transform: scale(1.1); }
        
        /* In-Game UI */
        #gameUI { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: red; border-radius: 50%; transform: translate(-50%, -50%); }
        
        .player-stats { position: absolute; bottom: 30px; left: 30px; width: 300px; }
        .stat-bar { width: 100%; height: 25px; background: #333; border: 2px solid #000; margin-top: 5px; position: relative; }
        #hpFill { height: 100%; background: #00ff00; width: 100%; transition: 0.2s; }
        #ultFill { height: 100%; background: #aa00ff; width: 0%; transition: 0.2s; }
        .stat-text { position: absolute; top: 2px; left: 10px; font-size: 20px; text-shadow: 1px 1px 0 #000; }
        
        .cooldowns { position: absolute; bottom: 30px; right: 30px; display: flex; gap: 15px; }
        .cd-box { width: 60px; height: 60px; background: rgba(0,0,0,0.5); border: 2px solid white; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-direction: column; }
        .cd-key { color: #ff0000; font-size: 16px; }
    </style>
</head>
<body>
    <div id="charSelect">
        <h1>SELECT YOUR SORCERER</h1>
        <div class="grid" id="roster"></div>
    </div>

    <div id="gameUI">
        <div id="crosshair"></div>
        <div class="player-stats">
            <h2 id="myName" style="margin:0; color: #ffaa00;">PLAYER</h2>
            <div class="stat-bar"><div id="hpFill"></div><div class="stat-text" id="hpText">1000 / 1000 HP</div></div>
            <div class="stat-bar"><div id="ultFill"></div><div class="stat-text" id="ultText">0 / 500 ULT</div></div>
        </div>
        <div class="cooldowns">
            <div class="cd-box"><span class="cd-key">Q</span><span id="cdQ">RDY</span></div>
            <div class="cd-box"><span class="cd-key">E</span><span id="cdE">RDY</span></div>
            <div class="cd-box"><span class="cd-key">R</span><span id="cdR">RDY</span></div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
