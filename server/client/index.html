<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shibuya Ruins Arena Fighter</title>
  <style>
    body, html { margin: 0; padding: 0; overflow: hidden; font-family: 'Impact', sans-serif; background: #000; user-select: none; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    
    #char-select { position: absolute; inset: 0; background: rgba(10,5,5,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; z-index: 100; overflow-y: auto; padding: 20px; }
    #char-select h1 { color: #cc0000; font-size: 3.5rem; text-shadow: 0 0 10px rgba(255,0,0,0.5); margin-bottom: 5px; }
    #char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; max-width: 900px; width: 100%; background: rgba(20,20,20,0.8); padding: 20px; border: 2px solid #333; border-radius: 8px; }
    .char-btn { background: #222; border: 2px solid #555; color: #fff; padding: 15px 10px; font-size: 1.1rem; cursor: pointer; border-radius: 4px; transition: 0.2s; text-transform: uppercase; }
    .char-btn:hover { background: #cc0000; border-color: #fff; transform: scale(1.05); }
    #player-name-input { padding: 12px; font-size: 1.2rem; margin-bottom: 15px; border-radius: 4px; border: none; width: 250px; text-align: center; }


    #hud { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; width: 450px; text-shadow: 2px 2px #000; }
    .bar-container { background: rgba(50,50,50,0.7); border: 2px solid #fff; border-radius: 4px; position: relative; height: 24px; overflow: hidden; }
    #hp-bar { background: linear-gradient(90deg, #ff3333, #aa0000); width: 100%; height: 100%; transition: width 0.1s; }
    #ult-bar { background: linear-gradient(90deg, #ffd700, #ff8c00); width: 0%; height: 100%; transition: width 0.1s; }
    .bar-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1rem; letter-spacing: 1px; }
    
    #cd-display { display: flex; justify-content: space-around; font-size: 1.2rem; color: #fff; background: rgba(0,0,0,0.6); padding: 6px; border-radius: 4px; border: 1px solid #444; }


    #death-screen { position: absolute; inset: 0; background: rgba(150,0,0,0.4); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 50; animation: flash 0.5s ease-out; }
    #death-screen h2 { color: #fff; font-size: 6rem; letter-spacing: 5px; margin: 0; text-shadow: 0 0 30px #000; }
    
    #damage-container { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .dmg-num { position: absolute; color: #ff1a1a; font-size: 2.2rem; font-weight: bold; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; animation: floatUp 0.8s forwards ease-out; }


    #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.7); border: 1px solid #000; }


    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.7); opacity: 1; }
      100% { transform: translateY(-70px) scale(1.2); opacity: 0; }
    }
    @keyframes flash {
      0% { background: rgba(255,0,0,0.8); }
      100% { background: rgba(150,0,0,0.4); }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  
  <div id="ui-layer">
    <div id="crosshair"></div>


    <div id="char-select">
      <h1>SHIBUYA ARENA</h1>
      <input type="text" id="player-name-input" placeholder="ENTER NAME" value="SORCERER">
      <div id="char-grid"></div>
    </div>


    <div id="hud" style="display:none;">
      <div class="bar-container">
        <div id="hp-bar"></div>
        <div class="bar-text">HP: <span id="hp-val">0</span></div>
      </div>
      <div class="bar-container">
        <div id="ult-bar"></div>
        <div class="bar-text">ULT: <span id="ult-val">0</span></div>
      </div>
      <div id="cd-display">
        <span>Q: READY</span>
        <span>E: READY</span>
        <span>R: READY</span>
      </div>
    </div>


    <div id="death-screen">
      <h2>YOU DIED</h2>
    </div>


    <div id="damage-container"></div>
  </div>


  <script type="module" src="/src/main.js"></script>
</body>
</html>
